[project]
name = "causal-medmnist"
version = "0.0.1"
description = "Causal benchmarks built on MedMNIST datasets"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
  "numpy>=1.24",
  "scipy>=1.10",
  "medmnist>=3.0.0",
]

[dependency-groups]
dev = [
    "pytest>=7",
    "matplotlib>=3.7",
    "ruff>=0.15.20",
]
benchmarks = [
    "ipykernel>=6",
    "torch>=2",
    "transformers>=4.40",
    "scikit-learn>=1.5",
    "gpytorch>=1.15",
    "seaborn>=0.13",
    "pandas>=2",
    "qpth>=0.0.18",
    "cvxopt>=1.3",
]

# qpth still declares numpy<2; override so it cannot drag the resolution down
[tool.uv]
override-dependencies = ["numpy>=2"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["causal_medmnist"]

[tool.ruff]
line-length = 160
indent-width = 4

[tool.ruff.lint]
extend-select = ["I"]
