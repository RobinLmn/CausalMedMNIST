[project]
name = "causal-medmnist"
version = "0.0.1"
description = "Causal benchmarks built on MedMNIST datasets"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
  "numpy>=1.24",
  "scipy>=1.10",
  "medmnist>=3.0.0",
]

[dependency-groups]
dev = ["pytest>=7", "matplotlib>=3.7"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["causal_medmnist"]
